services:
  telegram-bot-api:
    build:
      context: .
      dockerfile: Dockerfile.telegram-bot-api
    image: otveto4ka-telegram-bot-api:latest
    env_file:
      - .env
    command:
      - telegram-bot-api
      - --api-id=${TELEGRAM_API_ID:?TELEGRAM_API_ID is required for local Bot API}
      - --api-hash=${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required for local Bot API}
      - --local
      - --http-ip-address=0.0.0.0
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
    ports:
      - "${BOT_API_PORT_BIND:-127.0.0.1}:8081:8081"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    profiles:
      - local-bot-api
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  bot:
    build:
      context: .
    image: otveto4ka-bot:latest
    command: ["python", "-m", "app.bot"]
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.sqlite3
      ADMIN_ACCESS_KEYS_FILE: /data/admin_access_keys.json
      FFMPEG_PATH: /usr/bin/ffmpeg
      TZ: Europe/Kiev
    volumes:
      - bot_data:/data
      - bot_downloads:/app/downloads
      - bot_logs:/app/logs
      - bot_media:/app/media_storage
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

  api:
    image: otveto4ka-bot:latest
    build:
      context: .
    command: ["python", "-m", "uvicorn", "app.admin_api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.sqlite3
      ADMIN_ACCESS_KEYS_FILE: /data/admin_access_keys.json
      FFMPEG_PATH: /usr/bin/ffmpeg
      TZ: Europe/Kiev
    ports:
      - "8000:8000"
      - "50000:8000"
    volumes:
      - bot_data:/data
      - bot_downloads:/app/downloads
      - bot_logs:/app/logs
      - bot_media:/app/media_storage
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - bot

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - cloudflare
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  telegram_bot_api_data:
  bot_data:
  bot_downloads:
  bot_logs:
  bot_media:
